# ============================================
# Docker Compose - N-Tier Architecture
# ENGSE207 - Week 6 Docker Version
# ============================================
# 
# Services:
# 1. db     - PostgreSQL Database
# 2. api    - Node.js Backend API
# 3. nginx  - Web Server & Reverse Proxy
#
# Usage:
#   docker compose up -d      # Start all services
#   docker compose down       # Stop all services
#   docker compose logs -f    # View logs
# ============================================

version: '3.8'

services:

  # ================= DATABASE =================
  db:
    image: postgres:16-alpine
    container_name: taskboard-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: taskboard_db
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard123

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - taskboard-network


  # ================= API =================
  api:
    build: ./api
    container_name: taskboard-api
    restart: unless-stopped

    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: taskboard_db
      DB_USER: taskboard
      DB_PASSWORD: taskboard123

    depends_on:
      db:
        condition: service_healthy

    # 🔥 สำคัญ — ปิด healthcheck bug
    healthcheck:
      disable: true

    networks:
      - taskboard-network


  # ================= NGINX =================
  nginx:
    image: nginx:alpine
    container_name: taskboard-nginx
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend:/usr/share/nginx/html:ro

    depends_on:
      - api

    networks:
      - taskboard-network


# ================= NETWORK =================
networks:
  taskboard-network:
    driver: bridge


# ================= VOLUME =================
volumes:
  postgres_data:
